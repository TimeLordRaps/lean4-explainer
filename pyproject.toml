[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lean4-explainer"
version = "0.1.0"
description = "Build a static HTML proofsite from Lean 4 source, with L4DEL annotation checks and templates."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = ["lean", "lean4", "proofsite", "documentation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Documentation",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
# Extras name the built-in corpora (see `lean4-explainer sources`). They add no packages: the pinned sources are
# fetched from GitHub by `lean4-explainer fetch` / `showcase`.
conjectures = []
carleson = []
lft = []
flt = []
pfr = []
compfiles = []
tutorials = []
oai = []
all = []

[project.scripts]
lean4-explainer = "lean4_explainer.cli:main"

[project.urls]
Repository = "https://github.com/TimeLordRaps/lean4-explainer"

[tool.hatch.build.targets.wheel]
packages = ["src/lean4_explainer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
