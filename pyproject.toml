[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lean4-explainer"
version = "0.2.0"
description = "Build a static HTML proofsite from Lean 4 source. Extensions add L4DEL annotations and pinned Lean corpora."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = ["lean", "lean4", "proofsite", "documentation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Documentation",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
# Extensions. The core builds a plain site from Lean declarations and standard comments; each extra adds weight.
lean = ["lean4-explainer-lean>=0.1.0"]
ecosystem = ["lean4-explainer-ecosystem>=0.1.0"]
# 0.2.0 leaves the drawing to the map extension, so the two never draw two maps
l4del = ["lean4-explainer-l4del>=0.2.0"]
reader = ["lean4-explainer-reader>=0.1.0"]
map = ["lean4-explainer-map>=0.1.0"]
# One extra per corpus (a pinned Lean repository).
conjectures = ["lean4-explainer-formal-conjectures>=0.1.0"]
carleson = ["lean4-explainer-carleson>=0.1.0"]
flt = ["lean4-explainer-flt>=0.1.0"]
pfr = ["lean4-explainer-pfr>=0.1.0"]
compfiles = ["lean4-explainer-compfiles>=0.1.0"]
tutorials = ["lean4-explainer-mil>=0.1.0", "lean4-explainer-tpil>=0.1.0"]
oai = ["lean4-explainer-oai>=0.1.0"]
all = [
    "lean4-explainer-reader>=0.1.0",
    "lean4-explainer-map>=0.1.0",
    "lean4-explainer-formal-conjectures>=0.1.0",
    "lean4-explainer-carleson>=0.1.0",
    "lean4-explainer-flt>=0.1.0",
    "lean4-explainer-pfr>=0.1.0",
    "lean4-explainer-compfiles>=0.1.0",
    "lean4-explainer-mil>=0.1.0",
    "lean4-explainer-tpil>=0.1.0",
    "lean4-explainer-oai>=0.1.0",
]

[project.scripts]
lean4-explainer = "lean4_explainer.cli:main"

[project.urls]
Repository = "https://github.com/TimeLordRaps/lean4-explainer"

[tool.hatch.build.targets.wheel]
packages = ["src/lean4_explainer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
