name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    # the core alone, with no extension installed
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest -vv -s --durations=10

  extensions:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        package: [l4del, lean, ecosystem, corpora, reader, map, implications]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Lean (the Lean-run tests are skipped without it)
        if: runner.os == 'Linux' && (matrix.package == 'lean' || matrix.package == 'ecosystem' || matrix.package == 'implications')
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.34.1
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install
        run: python -m pip install -e ".[test]" -e packages/l4del -e packages/${{ matrix.package }}
      - name: Install the corpus packages (the corpora tests need them)
        if: matrix.package == 'corpora'
        shell: bash
        run: python -m pip install -e packages/reader -e packages/map -e packages/implications $(for d in packages/corpus-*; do printf -- "-e %s " "$d"; done)
      - name: Install the Lean extension (an edge's bridge is checked by the kernel when Lean runs)
        if: matrix.package == 'implications'
        run: python -m pip install -e packages/lean
      - name: Check node is there (the browser-script tests run under it)
        if: matrix.package == 'reader' || matrix.package == 'map' || matrix.package == 'implications'
        run: node --version
      - name: Syntax-check the implications catalogue browser harness
        if: matrix.package == 'implications'
        run: node --check packages/implications/tests/catalogue_page_harness.js
      - name: Test
        run: python -m pytest packages/${{ matrix.package }} -vv -s --durations=10

  release-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build frontend
        run: python -m pip install build
      - name: Build every wheel and source distribution
        shell: bash
        run: |
          mkdir dist
          python -m build --outdir dist .
          for package in packages/*; do
            if test -f "$package/pyproject.toml"; then
              python -m build --outdir dist "$package"
            fi
          done
      - name: Reject hosted annotations from release archives
        run: python scripts/audit_release_artifacts.py dist/*
