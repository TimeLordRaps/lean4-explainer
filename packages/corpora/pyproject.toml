[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lean4-explainer-corpora"
version = "0.2.0"
description = "Fetch pinned Lean repositories and build a showcase site of them with lean4-explainer."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["lean4-explainer>=0.2.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.entry-points."lean4_explainer.extensions"]
corpora = "lean4_explainer_corpora:CorporaExtension"

[project.urls]
Repository = "https://github.com/TimeLordRaps/lean4-explainer"

[tool.hatch.build.targets.wheel]
packages = ["src/lean4_explainer_corpora"]

[tool.pytest.ini_options]
testpaths = ["tests"]
