[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lean4-explainer-alphaproof-nexus"
version = "0.1.0"
description = "AlphaProof Nexus results as a lean4-explainer corpus: pinned commit, library roots and attribution."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["lean4-explainer-corpora>=0.5.0"]

[project.entry-points."lean4_explainer.corpora"]
alphaproof-nexus = "lean4_explainer_corpus_alphaproof_nexus:CORPUS"

[project.urls]
Repository = "https://github.com/TimeLordRaps/lean4-explainer"
Upstream = "https://github.com/google-deepmind/alphaproof-nexus-results"
Paper = "https://doi.org/10.1126/science.aej2213"

[tool.hatch.build.targets.wheel]
packages = ["src/lean4_explainer_corpus_alphaproof_nexus"]
