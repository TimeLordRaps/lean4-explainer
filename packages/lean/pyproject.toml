[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lean4-explainer-lean"
version = "0.1.0"
description = "Run Lean over a project and add tactic traces and axiom-based trust badges to lean4-explainer sites."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["lean4-explainer>=0.2.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.entry-points."lean4_explainer.extensions"]
lean = "lean4_explainer_lean:LeanExtension"

[project.urls]
Repository = "https://github.com/TimeLordRaps/lean4-explainer"

[tool.hatch.build.targets.wheel]
packages = ["src/lean4_explainer_lean"]

[tool.pytest.ini_options]
testpaths = ["tests"]
