[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lean4-explainer-l4del"
version = "0.3.0"
description = "L4DEL (Lean4 Domain Explanation Language) for lean4-explainer: comment-based titles, intuition, steps, prerequisites, glossary and learning path."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = ["lean", "lean4", "proofsite", "documentation", "l4del"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Documentation",
]
dependencies = ["lean4-explainer>=0.3.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.entry-points."lean4_explainer.extensions"]
l4del = "lean4_explainer_l4del:L4delExtension"

[project.urls]
Repository = "https://github.com/TimeLordRaps/lean4-explainer"

[tool.hatch.build.targets.wheel]
packages = ["src/lean4_explainer_l4del"]

[tool.pytest.ini_options]
testpaths = ["tests"]
