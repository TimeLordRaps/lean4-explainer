[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lean4-explainer-implications"
version = "0.1.0"
description = "Curated implication edges between Lean results, each with its contract and how far it is checked, for lean4-explainer."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["lean4-explainer>=0.3.1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.entry-points."lean4_explainer.extensions"]
implications = "lean4_explainer_implications:ImplicationsExtension"

[project.urls]
Repository = "https://github.com/TimeLordRaps/lean4-explainer"

[tool.hatch.build.targets.wheel]
packages = ["src/lean4_explainer_implications"]

[tool.pytest.ini_options]
testpaths = ["tests"]
