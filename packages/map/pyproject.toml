[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lean4-explainer-map"
version = "0.2.1"
description = "A map of how a Lean project's declarations and files build on each other, read from the code, for lean4-explainer."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["lean4-explainer>=0.3.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.entry-points."lean4_explainer.extensions"]
map = "lean4_explainer_map:MapExtension"

[project.urls]
Repository = "https://github.com/TimeLordRaps/lean4-explainer"

[tool.hatch.build.targets.wheel]
packages = ["src/lean4_explainer_map"]

[tool.pytest.ini_options]
testpaths = ["tests"]
