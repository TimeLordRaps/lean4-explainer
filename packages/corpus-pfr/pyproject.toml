[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lean4-explainer-pfr"
version = "0.1.0"
description = "Polynomial Freiman-Ruzsa (PFR) as a lean4-explainer corpus: pinned commit, library roots and license notes."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["lean4-explainer-corpora>=0.1.0"]

[project.entry-points."lean4_explainer.corpora"]
pfr = "lean4_explainer_corpus_pfr:CORPUS"

[project.urls]
Repository = "https://github.com/TimeLordRaps/lean4-explainer"
Upstream = "https://github.com/teorth/pfr"

[tool.hatch.build.targets.wheel]
packages = ["src/lean4_explainer_corpus_pfr"]
