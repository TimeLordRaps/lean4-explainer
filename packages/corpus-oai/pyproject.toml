[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lean4-explainer-oai"
version = "0.3.0"
description = "openai/math as a lean4-explainer corpus: pinned commit, library roots and license notes."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["lean4-explainer-corpora>=0.4.0"]

[project.entry-points."lean4_explainer.corpora"]
oai = "lean4_explainer_corpus_oai:CORPUS"

[project.urls]
Repository = "https://github.com/TimeLordRaps/lean4-explainer"
Upstream = "https://github.com/openai/math"

[tool.hatch.build.targets.wheel]
packages = ["src/lean4_explainer_corpus_oai"]
