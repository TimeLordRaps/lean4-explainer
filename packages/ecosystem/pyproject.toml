[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lean4-explainer-ecosystem"
version = "0.1.0"
description = "explain#Name links for chat, version diffs between builds, and a Lake facet for lean4-explainer."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["lean4-explainer>=0.2.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.entry-points."lean4_explainer.extensions"]
ecosystem = "lean4_explainer_ecosystem:EcosystemExtension"

[project.urls]
Repository = "https://github.com/TimeLordRaps/lean4-explainer"

[tool.hatch.build.targets.wheel]
packages = ["src/lean4_explainer_ecosystem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
