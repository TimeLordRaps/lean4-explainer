[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lean4-explainer-reader"
version = "0.2.0"
description = "A plain-English, step-by-step reading of every Lean declaration on a lean4-explainer site."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["lean4-explainer>=0.3.0"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.entry-points."lean4_explainer.extensions"]
reader = "lean4_explainer_reader:ReaderExtension"

[project.urls]
Repository = "https://github.com/TimeLordRaps/lean4-explainer"

[tool.hatch.build.targets.wheel]
packages = ["src/lean4_explainer_reader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
