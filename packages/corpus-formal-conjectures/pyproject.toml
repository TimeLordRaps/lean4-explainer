[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lean4-explainer-formal-conjectures"
version = "0.1.0"
description = "Formal Conjectures as a lean4-explainer corpus: pinned commit, library roots and license notes."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["lean4-explainer-corpora>=0.2.0"]

[project.entry-points."lean4_explainer.corpora"]
formal-conjectures = "lean4_explainer_corpus_formal_conjectures:CORPUS"

[project.urls]
Repository = "https://github.com/TimeLordRaps/lean4-explainer"
Upstream = "https://github.com/google-deepmind/formal-conjectures"

[tool.hatch.build.targets.wheel]
packages = ["src/lean4_explainer_corpus_formal_conjectures"]
